[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-course"
version = "0.1.0"
description = "Material docente reproducible de Machine Learning."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.4,<2",
    "xgboost>=2,<4",
    "prophet>=1.1,<2",
    "pmdarima>=2,<3",
    "openml>=0.14,<1",
    "ucimlrepo>=0.0.7,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
    "langchain-core>=0.3,<2",
    "langchain-ollama>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langchain-anthropic>=0.3,<2",
    "langgraph>=0.2,<2",
    "langsmith>=0.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]