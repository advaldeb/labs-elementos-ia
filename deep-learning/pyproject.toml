[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-labs"
version = "0.1.0"
description = "Laboratorios reproducibles de Deep Learning en español."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "torch>=2.2,<3",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]